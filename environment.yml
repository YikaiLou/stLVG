name: stLVG
channels:
  - pytorch
  - conda-forge
  - nvidia 
  - defaults

dependencies:
  - python=3.8.19

  - pytorch=2.2.1
  - torchvision
  - torchaudio
  
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - scanpy=1.9.8
  
  - matplotlib
  - jupyter
  - ipykernel
  - tqdm
  
  - pip
  - pip:
      - torch-scatter -f https://data.pyg.org/whl/torch-2.2.0.html
      - torch-sparse -f https://data.pyg.org/whl/torch-2.2.0.html
      - torch-geometric==2.5.2
      
      - plotly==5.20.0
      - opencv-python==4.9.0.80
      - faiss-cpu==1.8.0
      - pynvml==11.5.0
      - anndata
      
      - -e .